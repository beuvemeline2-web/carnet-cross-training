<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8"><title>Carnet Cross Training</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f4f6fb;--card:#fff;--tx:#1b2333;--mu:#667;--pr:#2457d6;--ok:#2e9e5b;--ko:#d93f3f;--bd:#d8deea}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12161f;--card:#1c2230;--tx:#eef1f8;--mu:#9aa3b8;--pr:#6c92ff;--bd:#323a4e}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:17px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
#app{max-width:900px;margin:auto;padding:14px}
h1{font-size:28px;margin:6px 0}h2{font-size:21px;margin:14px 0 8px}h3{font-size:17px;margin:8px 0 4px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;margin:8px 0}
button,select,input,textarea{font:inherit;color:var(--tx)}
button{background:var(--pr);color:#fff;border:0;border-radius:12px;padding:12px 18px;margin:3px;cursor:pointer;min-height:46px}
button.g{background:transparent;color:var(--pr);border:2px solid var(--pr)}button.ok{background:var(--ok)}button.ko{background:var(--ko)}
button:disabled{opacity:.45}
.big{font-size:24px;padding:22px 30px}
select,input,textarea{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:10px;max-width:100%}textarea{width:100%;min-height:90px}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}.grow{flex:1}
.tabs button{flex:1;background:var(--card);color:var(--tx);border:1px solid var(--bd)}.tabs button.on{background:var(--pr);color:#fff}
.lv{display:inline-block;min-width:92px;text-align:center;border-radius:10px;padding:10px;margin:3px;border:2px solid var(--bd);background:var(--card);color:var(--tx)}
.lv.v{border-color:var(--ok)}.mu{color:var(--mu);font-size:14px}
.sm button{background:var(--card);border:3px solid var(--bd);font-size:28px;padding:6px 10px}
.timer{font-size:96px;font-weight:700;text-align:center;font-variant-numeric:tabular-nums}
.bar{background:var(--pr);color:#fff;border-radius:12px;padding:12px;text-align:center;font-weight:600}
.z{display:inline-block;min-width:150px;min-height:44px;border:2px dashed var(--bd);border-radius:10px;padding:8px;margin:3px;vertical-align:middle}
.z.r{border-color:var(--ko);background:#d93f3f22}.z.vv{border-color:var(--ok);background:#2e9e5b22}
.chip{display:inline-block;background:var(--card);border:2px solid var(--pr);border-radius:20px;padding:8px 14px;margin:4px;cursor:pointer}.chip.s{background:var(--pr);color:#fff}
video{max-width:100%;border-radius:10px}#pzw{overflow-x:auto;border:1px solid var(--bd);border-radius:10px}.pzb{position:relative;min-width:980px;container-type:inline-size}.pzb img{width:100%;display:block;-webkit-user-drag:none;user-select:none}
.pzz{position:absolute;display:flex;align-items:center;justify-content:center;text-align:center;border:2px dashed #0007;border-radius:3px;font-weight:700;line-height:1.1;font-size:11px;font-size:1.05cqw;color:#111;cursor:pointer;overflow:hidden;padding:1px}.pzz.f{background:#fffd}.pzz.r{background:#d93f3fdd;color:#fff}.pzz.vv{background:#2e9e5bdd;color:#fff}
.bank{position:sticky;top:0;z-index:5;background:var(--bg);max-height:30vh;overflow:auto;padding:4px 0}.bank .chip{touch-action:none;user-select:none;-webkit-user-select:none;font-size:15px;padding:7px 12px;margin:3px}
@media(max-width:700px){.duo{grid-template-columns:1fr!important}}td,th{border:1px solid var(--bd);padding:6px}.gj{position:relative;height:60px;margin:6px 16px}.gt{position:absolute;top:24px;left:0;right:0;height:16px;border-radius:8px;background:linear-gradient(90deg,#d93f3f,#f08a30,#f2c230,#8bc34a,#2e9e5b)}.gs{position:absolute;top:0;font-size:42px;transform:translateX(-50%);pointer-events:none;line-height:1}.gj input{position:absolute;inset:0;width:100%;height:100%;opacity:0;margin:0}
</style></head><body><div id="app"></div>
<script>
const $=s=>document.querySelector(s),app=$('#app');
const FAM={haut:'Haut du corps',bas:'Bas du corps',gain:'Gainage',card:'Cardio'};
const MUS=['Trapèzes','Deltoïdes','Pectoraux','Biceps','Abdominaux','Quadriceps','Tibial antérieur'];
const DOT=[[100,60],[58,72],[85,88],[46,112],[100,135],[84,215],[83,292]];
const FEEL={re:'Respiration',ch:'Chaleur',mu:'Ressenti musculaire'};
const SMI=['😄','🙂','😟','🥵'],COL=['#2e9e5b','#f2c230','#f08a30','#d93f3f'];
const uid=()=>Math.random().toString(36).slice(2,9);
const mkEx=(fam,name)=>({id:'e_'+String(name).toLowerCase().replace(/\W/g,''),fam,name,lv:[1,2,3,4].map(n=>({t:'Niveau '+n,v:'',c:'',r:''}))});
const DOCX=[['haut','Push up'],['haut','Crunchs'],['bas','Air squat'],['bas','Lunge'],['gain','Plank'],['gain','Superman'],['card','Jumping jacks'],['card','Burpees'],['card','Mountain climbers']];
const norm=x=>String(x).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
let cfg={pin:'1234',cls:{'3ème A':[],'3ème B':[]},unl:1,tab:['Jumping jacks','Squats','Burpees','Mountain climbers','Fentes','Gainage','Montées de genoux','Pompes'],
 ex:DOCX.map(([f,n])=>mkEx(f,n))};
let st={},V={v:'home'},run=null,iv=null,DB=null;
const lg=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))||d}catch(e){return d}};
cfg=lg('cfg',cfg);function fixEx(){const o=JSON.stringify(cfg.ex.map(e=>e.id+e.name));cfg.ex=DOCX.map(([f,n])=>{const e=cfg.ex.find(x=>x.fam==f&&norm(x.name).slice(0,6)==norm(n).slice(0,6));if(e)e.name=n;return e||mkEx(f,n)});return o!=JSON.stringify(cfg.ex.map(e=>e.id+e.name))}
if(fixEx())try{localStorage.setItem('cfg',JSON.stringify(cfg))}catch(e){}
lg('ids',[]).forEach(i=>st[i]=lg('s_'+i,null));
const DIRTY=lg('dirty',{});
const svDirty=()=>{try{localStorage.setItem('dirty',JSON.stringify(DIRTY))}catch(e){}};
function updSync(){let e=$('#sync');if(!e){e=document.createElement('div');e.id='sync';e.style.cssText='position:fixed;right:8px;bottom:8px;z-index:8;font-size:13px;padding:4px 10px;border-radius:12px;background:var(--card);color:var(--tx);border:1px solid var(--bd);opacity:.92';document.body.appendChild(e)}const n=Object.keys(DIRTY).length;e.textContent=DB?(n?'🟠 En attente de synchro ('+n+')':'🟢 Synchronisé'):'⚪ Hors ligne : données gardées sur cette tablette'}
async function push(path,obj){if(!DB)return false;try{await DB.doc(path).set({j:JSON.stringify(obj)});delete DIRTY[path];svDirty();updSync();return true}catch(e){return false}}
async function put(path,obj,key){obj._t=Date.now();try{localStorage.setItem(key,JSON.stringify(obj))}catch(e){}DIRTY[path]=key;svDirty();updSync();await push(path,obj)}
const cur=path=>path=='config/main'?cfg:st[path.slice(2)];
async function flush(){for(const path of Object.keys(DIRTY)){const o=cur(path);if(o)await push(path,o);else{delete DIRTY[path];svDirty()}}updSync()}
function merge(path,key,r){const l=cur(path);if(!l||!l._t||(r._t||0)>l._t){if(path=='config/main')cfg=r;else{st[path.slice(2)]=r;try{localStorage.setItem('ids',JSON.stringify(Object.keys(st)))}catch(e){}}try{localStorage.setItem(key,JSON.stringify(r))}catch(e){}return true}if(l._t>(r._t||0)){DIRTY[path]=key;svDirty();push(path,l)}return false}
const saveC=()=>put('config/main',cfg,'cfg');
const saveS=i=>{try{localStorage.setItem('ids',JSON.stringify(Object.keys(st)))}catch(e){};put('s/'+i,st[i],'s_'+i)};
async function initDB(){if(DB)return;try{const d=await claude.use('db');if(!d)return;DB=d;
 DB.doc('config/main').onSnapshot(q=>{if(q.exists){if(merge('config/main','cfg',JSON.parse(q.data().j))){if(fixEx())saveC();if(!run)R()}}else{DIRTY['config/main']='cfg';svDirty();flush()}});
 DB.collection('s').onSnapshot(q=>{let ch=0;q.docs.forEach(x=>{if(merge('s/'+x.id,'s_'+x.id,JSON.parse(x.data().j)))ch=1});Object.keys(st).forEach(id=>{if(st[id]&&!q.docs.some(x=>x.id==id)){DIRTY['s/'+id]='s_'+id}});svDirty();flush();if(ch&&!run)R()});flush();updSync()}catch(e){DB=null;updSync()}}
initDB();setInterval(()=>{if(!DB)initDB();else flush()},20000);window.addEventListener('online',()=>{initDB();flush()});setTimeout(updSync,50);

const S=i=>st[i]=st[i]||{pass:{},pz:0,les:{},pzs:{}};
const stu=i=>{for(const c in cfg.cls){const s=cfg.cls[c].find(x=>x.id==i);if(s)return s}return{name:'?'}};
const fmt=t=>Math.floor(t/60)+':'+String(t%60).padStart(2,'0');
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const go=(v,o={})=>{V={...V,v,...o};R();window.scrollTo(0,0)};
const back=(v,l='← Retour')=>`<button class="g" onclick="go('${v}')">${l}</button>`;
const vid=u=>!u?'':/\.(mp4|webm)(\?|$)/i.test(u)?`<video controls src="${esc(u)}"></video>`:`<a href="${esc(u)}" target="_blank" rel="noopener"><button>▶ Voir la vidéo</button></a>`;
function R(){const f={home,cls,car,teach,les,run:drawRun,login}[V.v];app.innerHTML=f()}
function home(){return `<h1>💪 Carnet Cross Training</h1><p class="mu">EPS – 3ème · Choisis ta classe</p>
<div class="row">${Object.keys(cfg.cls).map(c=>`<button class="big grow" onclick="go('cls',{c:'${c}',grp:[]})">${c}</button>`).join('')}</div>
<p><button class="g" onclick="tLogin()">🔒 Espace enseignant</button></p>`}
function tLogin(){go('login')}
function login(){return `${back('home')}<h1>Espace enseignant</h1><div class="card">Code : <input id="lp" type="password" inputmode="numeric" size="8"> <button onclick="if($('#lp').value===cfg.pin)go('teach',{tt:'el',ts:null});else toast('Code incorrect')">Entrer</button></div>${cfg.pin==='1234'?'<p class="mu">Code par défaut : 1234. Change-le dans Réglages.</p>':''}`}
let tmr;function toast(m){let e=$('#toast');if(!e){e=document.createElement('div');e.id='toast';e.style.cssText='position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1b2333;color:#fff;padding:12px 18px;border-radius:12px;z-index:9;max-width:90%';document.body.appendChild(e)}e.textContent=m;e.style.display='block';clearTimeout(tmr);tmr=setTimeout(()=>e.style.display='none',2500)}
function cf(m){if(V.cf===m){V.cf=null;return true}V.cf=m;toast(m+' Touche encore pour confirmer.');return false}
function cls(){const l=cfg.cls[V.c],g=V.grp||[];return `${back('home')}<h2>${V.c} – Choisis 1 ou 2 élèves</h2>${l.length?l.map(s=>`<span class="chip ${g.includes(s.id)?'s':''}" style="font-size:22px;padding:14px 22px" onclick="tg2('${s.id}')">${esc(s.name)}</span>`).join(''):'<p class="mu">Aucun élève (à ajouter depuis l’espace enseignant).</p>'}<p><button class="big ok" ${g.length?'':'disabled'} onclick="openG()">Ouvrir ${g.length>1?'les carnets':'le carnet'}</button></p>`}
function clsOld(){const l=cfg.cls[V.c];return `${back('home')}<h2>${V.c} – Qui es-tu ?</h2>${l.length?l.map(s=>`<button class="big" onclick="go('car',{me:'${s.id}',pair:[],tab:'pass'})">${esc(s.name)}</button>`).join(''):'<p class="mu">Aucun élève (à ajouter depuis l’espace enseignant).</p>'}`}
function car(){const me=V.me,t=V.tab;let h=`${back('cls','← Changer d’élève')}<h1>Carnet de ${esc(stu(me).name)}</h1>
<div class="row tabs">${V.grp.map(i=>`<button class="${i==V.me?'on':''}" onclick="sw('${i}')">👤 ${esc(stu(i).name)}</button>`).join('')}</div><div style="display:none">${[].map(s=>`<span class="chip ${V.pair.includes(s.id)?'s':''}" onclick="tp('${s.id}')">${esc(s.name)}</span>`).join('')}</div>
<div class="row tabs">${[['pass','🛂 Passeport'],['les','📘 Leçons'],['puz','🧩 Puzzle']].map(([k,n])=>`<button class="${t==k?'on':''}" onclick="go('car',{tab:'${k}'})">${n}</button>`).join('')}</div>`;
return h+(t=='pass'?pass():t=='puz'?puz():lessons())}
function tg2(i){const g=V.grp=V.grp||[];if(g.includes(i))g.splice(g.indexOf(i),1);else if(g.length<2)g.push(i);else toast('2 élèves maximum');R()}
function openG(){go('car',{me:V.grp[0],pair:V.grp.slice(1),tab:'pass',open:null})}
function sw(i){V.me=i;V.pair=V.grp.filter(x=>x!=i);V.open=null;V.chk=0;V.sel=null;R()}
function vld(k){if($('#vc').value===cfg.pin){S(V.me).pass[k]=1;saveS(V.me);toast('Niveau validé ✅');R()}else toast('Code incorrect')}
function tp(i){const p=V.pair;if(p.includes(i))p.splice(p.indexOf(i),1);else if(p.length<2)p.push(i);R()}
function pass(){const s=S(V.me);s.pend=s.pend||{};return `<p class="mu">✅ validé · ⏳ réussi, à valider · 🔓 disponible · 🔒 verrouillé. Les niveaux se valident pendant les leçons : 10 reps réussies.</p>`+Object.keys(FAM).map(f=>`<h2>${FAM[f]}</h2>`+cfg.ex.filter(e=>e.fam==f).map(e=>`<div class="card"><h3>${esc(e.name)}</h3>${e.lv.map((l,n)=>{const v=s.pass[e.id+'_'+n],u=n==0||s.pass[e.id+'_'+(n-1)],pd=s.pend[e.id+'_'+n]&&!v;return `<button class="lv ${v?'v':''}" onclick="go('car',{open:'${e.id}_${n}'})">${v?'✅':pd?'⏳':u?'🔓':'🔒'}<br>Niv. ${n+1}</button>`}).join('')}
${V.open&&V.open.startsWith(e.id+'_')?(()=>{const k=V.open,n=+k.split('_').pop(),l=e.lv[n],u=n==0||s.pass[e.id+'_'+(n-1)];if(!u)return '<p class="mu">🔒 Valide le niveau précédent pour débloquer celui-ci.</p>';const cr=(l.r||'').split('\n').map(x=>x.trim()).filter(Boolean);return `<div class="card"><h3>${esc(l.t)}</h3>${vid(l.v)}<p><b>Critères de réalisation</b><br>${esc(l.c).replace(/\n/g,'<br>')}</p><p><b>Critères de réussite</b></p><ul>${cr.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>${s.pass[k]?'<div class="bar" style="background:var(--ok)">✅ Niveau validé</div>':s.pend[k]?`<p>Niveau réussi en leçon ! Valide-le avec le code de ton prof :</p><input id="vc" type="password" inputmode="numeric" placeholder="Code enseignant" size="12"> <button onclick="vld('${k}')">Valider ce niveau</button>`:'<p class="mu">Pour valider ce niveau : réussis 10 reps validées par ton juge sur 20 reps, dans la leçon (partie « Validation des niveaux »).</p>'}</div>`})():''}</div>`).join('')).join('')}

function reprendre(si){V.si=si;const r=RS[rk(si)]||lg('rs_'+rk(si),null);if(r)startRun(r.steps,f=>phDone(f,V.L,si,grp()),r)}
function pause(){clearInterval(iv);const r=run;RS[r.key]=r;try{localStorage.setItem('rs_'+r.key,JSON.stringify({steps:r.steps,i:r.i,t:r.t,c:r.c,h:r.h,key:r.key}))}catch(e){}run=null;go('les')}
function bil(d,L){const c=LS[L];let h='';if(c){const rows=c.b.filter(b=>(d.sets||{})[b.id]).map(b=>{const a=d.sets[b.id],ok=a.reduce((x,y)=>x+(y?y.ok:0),0),no=a.reduce((x,y)=>x+(y?y.no:0),0),tgs=a.reduce((x,y)=>x+(y&&y.tg?y.tg:0),0)||'–',lb=b.t=='e'?'S':b.t=='x'?'R':'';return `<tr><td>${esc(b.name)}</td><td>${a.map((y,j)=>y?`${lb}${j+1} ${esc(y.ex)} : cible ${y.tg||'–'} · ${y.ok}/${y.no}`:'').filter(Boolean).join('<br>')}</td><td>${tgs}</td><td><b>${ok}</b></td><td><b>${no}</b></td></tr>`}).join('');if(rows)h+=`<div style="overflow-x:auto"><table style="border-collapse:collapse;width:100%"><tr><th>Bloc</th><th>Détail</th><th>Cible</th><th>✔</th><th>✖</th></tr>${rows}</table></div>`}
const f=n=>Math.floor(n/60)+' min '+n%60+' s';
return h+`${c&&c.pre?`<p><b>Pré-requis ${esc(c.pre)} N1 :</b> ${d.pre===1?'validé ✅':d.pre===0?'non validé ❌':'–'}</p>`:''}${c&&c.wod?`<p><b>Team WOD :</b> ${d.wod?f(d.wod)+(d.partner?' avec '+esc(d.partner):''):'–'}${c.wl.map((x,i)=>{const w=(d.wl||{})[i]||{};return `<br><span class="mu">${esc(x.l)}${w.ex?' ('+esc(w.ex)+')':''} : ${w.n||0}/${x.n} · no rep ${w.no||0}</span>`}).join('')}</p>`:''}<p><b>Ressentis :</b> ${Object.keys(FEEL).map(k=>FEEL[k]+' '+sm(d.feel[k])).join(' · ')}</p><p><b>FC :</b> ${d.fc?d.fc+' bpm':'–'}</p>`}
function startRun(steps,done,r){const key=steps.some(s=>s.p)?rk(V.si):null;if(!r&&key){delete RS[key];try{localStorage.removeItem('rs_'+key)}catch(e){}}run=r?{...r,done}:{steps,i:0,t:steps[0].sec,done,c:{},key};clearInterval(iv);iv=setInterval(()=>{const s=run.steps[run.i];if(!s.sec)return;if(--run.t<=0)nxt();else{const e=$('#tm');if(e)e.textContent=fmt(run.t)}},1000);go('run')}
function nxt(){const s=run.steps[run.i];if((s.k=='work'||s.k=='val')&&!s.t){const c=run.c[run.i]||{ok:0,no:0},p=S(s.p),d=p.les[s.L]=p.les[s.L]||{tab:[],tab2:[],feel:{},sets:{}};(d.sets[s.f]=d.sets[s.f]||[])[s.s-1]={ok:c.ok,no:c.no,ex:s.ch,tg:s.tg||0};if(s.k=='val'&&c.ok>=s.tg&&!p.pass[s.exid+'_'+s.lv]){p.pend=p.pend||{};p.pend[s.exid+'_'+s.lv]=1}saveS(s.p)}
 run.i++;if(run.i>=run.steps.length)return quit(1);run.t=run.steps[run.i].sec;R();if(navigator.vibrate)navigator.vibrate(200)}
function quit(f){clearInterval(iv);const d=run.done;if(run.key){delete RS[run.key];try{localStorage.removeItem('rs_'+run.key)}catch(e){}}run=null;if(f)toast('Bravo, terminé ! 🎉');d(f)}
function cnt(k){const s=run.steps[run.i],c=run.c[run.i]=run.c[run.i]||{ok:0,no:0};if(run.h&&run.h[run.i])return;c[k]++;if(s.k=='val'){const pp=S(s.p),key=s.exid+'_'+s.lv;if(k=='ok'&&c.ok>=s.tg){if(!pp.pass[key]){pp.pass[key]=1;saveS(s.p)}toast('Niveau '+(s.lv+1)+' validé ✅ Au tour de l’autre élève');appendTurn(s);nxt();return}if(c.ok+c.no>=s.cap){toast('20 reps : changement de tour');appendTurn(s);nxt();return}}if(k=='ok'&&s.hold&&c.ok>=s.tg){run.h=run.h||{};run.h[run.i]=1;if(navigator.vibrate)navigator.vibrate([200,100,200])}R()}
function mkVal(p,L,f,e,lv,a,jg){const nm=stu(p).name;return [{k:'wait',lab:`${nm} : niveau ${lv+1} – ${e.name}`,sub:`10 reps réussies = niveau validé (20 reps maximum) · Juge : ${jg}`},{k:'val',p,L,f,s:a,ch:e.name+' – niv. '+(lv+1),tg:10,cap:20,exid:e.id,lv,jg,bar:`Niveau ${lv+1} : 10 reps réussies sur 20 reps`,lab:`${nm} – ${e.name} niv. ${lv+1}`,sub:`Juge : ${jg}`}]}
function appendTurn(s){const e=cfg.ex.find(x=>x.id==s.exid),n=e?e.lv.findIndex((l,j)=>!S(s.p).pass[e.id+'_'+j]):-1;if(n>=0)run.steps.push(...mkVal(s.p,s.L,s.f,e,n,s.s+1,s.jg))}
function skipV(){appendTurn(run.steps[run.i]);nxt()}
function endVal(){run.steps.splice(run.i+1);nxt()}
function drawRun(){const s=run.steps[run.i],c=run.c[run.i]||{ok:0,no:0};
return `${s.bar?`<div class="bar">${esc(s.bar)}</div>`:''}${s.rp?`<p style="text-align:center;font-size:24px">🏆 Ton record : <b>${s.rec==null?'—':s.rec}</b> reps${s.rec!=null&&c.ok>s.rec?' · 🎉 Nouveau record !':''}</p>`:''}
<h2 style="text-align:center;color:${s.k=='rest'?'var(--ok)':'var(--tx)'}">${esc(s.lab)}</h2><p class="mu" style="text-align:center">${esc(s.sub)}</p>
${s.k=='wait'?'<div style="text-align:center"><button class="big ok" onclick="nxt()">C’est parti !</button></div>':s.k=='val'?'':`<div class="timer" id="tm">${fmt(run.t)}</div>`}
${run.h&&run.h[run.i]?'<div class="bar" style="background:var(--ok);font-size:22px">✅ Objectif atteint ! Récupère jusqu’à la prochaine minute</div><p style="text-align:center;font-size:20px">Réalisées : '+c.ok+' · No rep : '+c.no+'</p>':(s.k=='work'||s.k=='val')&&!s.t?`<div class="row" style="justify-content:center"><button class="big ok" onclick="cnt('ok')">✔ Rep valide : ${c.ok}</button><button class="big ko" onclick="cnt('no')">✖ No rep : ${c.no}</button></div><p class="mu" style="text-align:center">${s.cap?`Validées : ${c.ok}/10 · Total : ${c.ok+c.no}/${s.cap}${c.ok>=10?' · ✅ Niveau validé !':''}`:s.tg?`Cible : ${s.tg} · Réalisées : ${c.ok}`:`Total : ${c.ok+c.no}`}</p>`:''}
${s.k=='val'||(s.k=='wait'&&run.steps[run.i+1]&&run.steps[run.i+1].k=='val')?`<p style="text-align:center"><button class="g" onclick="endVal()">⏹ Terminer la validation</button></p>`:''}<p style="text-align:center"><button class="g" onclick="${s.k=='val'?'skipV()':'nxt()'}">${s.k=='val'?'⏭ Passer mon tour':'⏭ Passer'}</button>${run.key?'<button class="g" onclick="pause()">⏸ Quitter, reprendre plus tard</button>':''}<button class="g" onclick="if(cf('Arrêter ?'))quit(0)">⏹ Arrêter</button></p>`}
/* ---------- Espace enseignant ---------- */
function teach(){const t=V.tt;return `${back('home','← Accueil')}<h1>Espace enseignant</h1>
<div class="row tabs">${[['el','👥 Élèves'],['ex','📝 Exercices'],['le','📘 Leçons'],['re','⚙️ Réglages']].map(([k,n])=>`<button class="${t==k?'on':''}" onclick="go('teach',{tt:'${k}',ts:null})">${n}</button>`).join('')}</div>`+(t=='ex'?tEx():t=='le'?tLe():t=='re'?tRe():V.ts?tSt():tEl())}
function tEl(){return `${Object.keys(cfg.cls).map(c=>`<h2>${c}</h2>${cfg.cls[c].map(s=>{const p=S(s.id),n=Object.keys(p.pass).filter(k=>p.pass[k]).length;return `<button class="g" onclick="go('teach',{ts:'${s.id}'})">${esc(s.name)} · ${n}/${cfg.ex.length*4} niv. ${p.pz?'· 🧩':''}</button>`}).join('')}
<div class="card"><b>Ajouter des prénoms</b> (un par ligne)<textarea id="n_${c}"></textarea><button onclick="addN('${c}')">Ajouter</button></div>`).join('')}
`}
function loadDoc(){cfg.ex=DOCX.map(([f,n])=>cfg.ex.find(e=>e.fam==f&&norm(e.name)==norm(n))||mkEx(f,n));saveC();R()}
function addN(c){const el=document.getElementById('n_'+c);el.value.split('\n').map(x=>x.trim()).filter(Boolean).forEach(n=>cfg.cls[c].push({id:uid(),name:n}));saveC();R();toast('Élèves ajoutés')}
function tSt(){const i=V.ts,p=S(i);return `<button class="g" onclick="go('teach',{ts:null})">← Élèves</button><h2>${esc(stu(i).name)}</h2>
<button class="ko" onclick="if(cf('Supprimer cet élève ?')){for(const c in cfg.cls)cfg.cls[c]=cfg.cls[c].filter(x=>x.id!='${i}');saveC();go('teach',{ts:null})}">Supprimer l’élève</button>
<button class="g" onclick="S('${i}').pz=0;S('${i}').pzs={};saveS('${i}');R()">Réinitialiser puzzle (${p.pz?'validé':'non validé'})</button>
${Object.keys(FAM).map(f=>`<h3>${FAM[f]}</h3>`+cfg.ex.filter(e=>e.fam==f).map(e=>`<div class="card">${esc(e.name)} ${e.lv.map((l,n)=>`<button class="lv ${p.pass[e.id+'_'+n]?'v':''}" onclick="tg('${i}','${e.id}_${n}')">${p.pass[e.id+'_'+n]?'✅':(p.pend||{})[e.id+'_'+n]?'⏳':'⬜'} N${n+1}</button>`).join('')}</div>`).join('')).join('')}
<h3>Leçons</h3>${Object.keys(p.les).map(L=>`<div class="card"><b>Leçon ${L}</b> · Tabata : ${esc((p.les[L].tab||[]).filter(Boolean).join(', ')||'—')}<br>Ressentis : ${Object.keys(FEEL).map(k=>FEEL[k]+' '+(p.les[L].feel[k]||'–')).join(' · ')} · FC ${p.les[L].fc||'–'}${bil(p.les[L],L)}</div>`).join('')||'<p class="mu">Rien encore.</p>'}`}
function tRe(){return `<div class="card"><h2>🔑 Mon code enseignant</h2><p class="mu">Ce code protège l’espace enseignant. Choisis-en un que tu es le seul à connaître.</p>
<div style="margin:6px 0"><div class="mu">Code actuel</div><input id="p0" type="password" inputmode="numeric"></div>
<div style="margin:6px 0"><div class="mu">Nouveau code (4 caractères minimum)</div><input id="p1" type="password" inputmode="numeric"></div>
<div style="margin:6px 0"><div class="mu">Nouveau code, encore une fois</div><input id="p2" type="password" inputmode="numeric"></div>
<button class="ok" onclick="chPin()">Enregistrer mon nouveau code</button></div>
<p class="mu">Le code est un simple verrou pour la classe : il n’est pas chiffré. Ne mets pas un code que tu utilises ailleurs.</p>`}
function chPin(){const a=$('#p0').value,b=$('#p1').value,c=$('#p2').value;if(a!==cfg.pin)return toast('Code actuel incorrect');if(b.length<4)return toast('Le nouveau code doit faire 4 caractères minimum');if(b!==c)return toast('Les deux nouveaux codes sont différents');cfg.pin=b;saveC();toast('Nouveau code enregistré ✅');R()}
function tg(i,k){const p=S(i);p.pass[k]=!p.pass[k];saveS(i);R()}
function tEx(){return cfg.ex.map((e,x)=>`<div class="card"><div class="row"><b>${FAM[e.fam]}</b><b class="grow">${esc(e.name)}</b></div>
${e.lv.map((l,n)=>`<details><summary>Niveau ${n+1} – ${esc(l.t)}</summary><input style="width:100%" placeholder="Titre" value="${esc(l.t)}" onchange="cfg.ex[${x}].lv[${n}].t=this.value;saveC()"><input style="width:100%;margin-top:4px" placeholder="Lien vidéo (.mp4 direct, ou lien web)" value="${esc(l.v)}" onchange="cfg.ex[${x}].lv[${n}].v=this.value;saveC()"><textarea placeholder="Critères de réalisation" onchange="cfg.ex[${x}].lv[${n}].c=this.value;saveC()">${esc(l.c)}</textarea><textarea placeholder="Critères de réussite" onchange="cfg.ex[${x}].lv[${n}].r=this.value;saveC()">${esc(l.r)}</textarea></details>`).join('')}</div>`).join('')}
function tLe(){return `${tgUI()}<div class="card"><h2>Leçons débloquées : ${cfg.unl}/8</h2><button onclick="cfg.unl=Math.min(8,cfg.unl+1);saveC();R()">🔓 Débloquer la leçon ${Math.min(8,cfg.unl+1)}</button><button class="g" onclick="cfg.unl=Math.max(1,cfg.unl-1);saveC();R()">Reverrouiller la dernière</button></div>

<div class="card"><h3>Déroulé des leçons 2 à 8 (texte affiché à l’élève)</h3>${[2,3,4,5,6,7,8].map(n=>`Leçon ${n}<textarea onchange="(cfg.lt=cfg.lt||{})[${n}]=this.value;saveC()">${esc((cfg.lt||{})[n]||'')}</textarea>`).join('')}</div>`}
R();
</script></body></html>
